    <form>
<label for="datetime">Choose Date:</label>
<input type="date" id="datetime">

    </br>
<label for="selector1">Choose your Dish:</label>
<select name="dishes" id="selector1">
    <option value="maggie">Maggi</option>
    <option value="pizza">Pizza</option>
    <option value="colddrink">Cold Drink</option>
</select>

<br>
<button>Click me</button>

<br>
<label for="para">Write your Thoughts:</label>
<textarea name="paragraph" id="para" cols="80" rows="10" placeholder="Enter your thoughts"></textarea>


<fieldset>
    <legend>Choose the Movie:</legend>
    <label for="movie">Choose your movie </label>
    <select name="choose" id="movie" multiple>
        <option value="pk">PK</option>
        <option value="rana">rana</option>
        <option value="jaat">jaat</option>
    </select>
    <button>Click me</button>

    <label>Select gender:</label><br>
    <input type="radio" name="gender" value="male"> Male<br>
    <input type="radio" name="gender" value="female"> Female<br>
    <input type="radio" name="gender" value="other"> Other
</fieldset>

    </form>

</body>
